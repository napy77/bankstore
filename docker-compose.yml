# Postgres para desarrollo local.
# Puerto 5434 para no chocar con el 5433 de NexoPOS ni con un Postgres del
# sistema en 5432.
services:
  postgres:
    image: postgres:16-alpine
    container_name: bankstore-db
    environment:
      POSTGRES_USER: bankstore
      POSTGRES_PASSWORD: bankstore
      POSTGRES_DB: bankstore
    ports:
      - "5434:5432"
    volumes:
      - bankstore_pgdata:/var/lib/postgresql/data

volumes:
  bankstore_pgdata:
